[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-runtrace"
version = "0.1.0.dev0"
description = "A lightweight CLI for reproducible machine-learning experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "RunTrace contributors" },
]
keywords = [
  "experiment-tracking",
  "machine-learning",
  "reproducibility",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.urls]
Changelog = "https://github.com/Corvus-226/RunTrace/blob/main/CHANGELOG.md"
Issues = "https://github.com/Corvus-226/RunTrace/issues"
Repository = "https://github.com/Corvus-226/RunTrace"

[project.scripts]
runtrace = "runtrace.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runtrace"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true
